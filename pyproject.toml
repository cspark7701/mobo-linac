[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobo-linac"
version = "0.1.0"
description = "Multi-Objective Bayesian Optimization for a 200 MeV Electron Injector Linac"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Chong Shik Park", email = "kuphy@korea.ac.kr" }
]
dependencies = [
    "torch>=2.0.0",
    "botorch>=0.10.0",
    "gpytorch>=1.10",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "distgen @ git+https://github.com/ColwynGulliford/distgen.git",
    "lume-astra @ git+https://github.com/ChristopherMayes/lume-astra.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mobo-linac = "mobo_linac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-W ignore"
markers = [
    "integration: mark test as an integration test running real ASTRA simulations.",
]
filterwarnings = [
    "ignore",
]




