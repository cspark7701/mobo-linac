[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobo-linac"
dynamic = ["version"]
description = "Multi-Objective Bayesian Optimization for a 200 MeV Electron Injector Linac"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Chong Shik Park", email = "kuphy@korea.ac.kr" }
]
dependencies = [
    "torch>=2.0.0",
    "botorch>=0.10.0",
    "gpytorch>=1.10",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "openpmd-beamphysics>=0.8.0",
    # Pinned to the revisions of the reference environment (see requirements-publication.txt).
    "distgen @ git+https://github.com/ColwynGulliford/distgen.git@d856bc123fc23f188cc2f95f6b6eaa91826abce6",
    "lume-astra @ git+https://github.com/ChristopherMayes/lume-astra.git@0af6c8454819a1cd22b789db7065ef6f0970dfbf",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6",
    "build>=1.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.0",
]

[project.scripts]
mobo-linac = "mobo_linac.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mobo_linac.__version__" }  # the single version source

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
# Bundled configurations, found by the default configuration search of installed wheels.
"share/mobo-linac/configs" = ["configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: mark test as an integration test running real ASTRA simulations.",
]
# Warnings raised by this package fail the suite unless a test asserts them with pytest.warns;
# third-party warnings are reported but do not fail.
filterwarnings = [
    "default",
    "error::SyntaxWarning",
    "error::DeprecationWarning:mobo_linac.*",
    "error::RuntimeWarning:mobo_linac.*",
    "error::UserWarning:mobo_linac.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "release", "results"]

[tool.ruff.lint]
# pyflakes, syntax errors and invalid escape sequences
select = ["F", "E9", "W605"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # package re-exports
