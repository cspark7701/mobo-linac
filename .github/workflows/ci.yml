name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (pyflakes, syntax errors, invalid escape sequences; configured in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"
          ruff check src scripts tests tools

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared range: requires-python = ">=3.10"
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install the package with development extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Package version matches the distribution metadata
        run: |
          python -c "import importlib.metadata as m, mobo_linac; assert mobo_linac.__version__ == m.version('mobo-linac'), mobo_linac.__version__"
      - name: Documentation and configuration sync
        run: python scripts/verify_docs_sync.py
      - name: Unit tests (package warnings are errors; no ASTRA binary required)
        run: |
          pytest -m "not integration" --tb=short --cov=mobo_linac --cov-report=term --cov-fail-under=85

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and install it into a fresh environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Installed CLI runs outside the source tree
        run: |
          cd /tmp
          /tmp/wheel-env/bin/mobo-linac --help
          # bundled configurations (share/mobo-linac/configs) drive a mock campaign
          /tmp/wheel-env/bin/mobo-linac run-unconstrained --mock-evaluator --num-initial-samples 2 \
            --n-iterations 0 --output-dir /tmp/smoke-run --device cpu --quiet
          test -f /tmp/smoke-run/run_complete.json
          /tmp/wheel-env/bin/python -c "import sys, mobo_linac.campaigns; assert 'matplotlib' not in sys.modules"
