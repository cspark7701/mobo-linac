name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov
          pip install git+https://github.com/ColwynGulliford/distgen.git
          pip install git+https://github.com/ChristopherMayes/lume-astra.git
          pip install -e .

      - name: Set binary permissions
        run: |
          chmod +x bin/* || true

      - name: Smoke test — package import and version
        run: |
          python -c "import mobo_linac; print('mobo_linac version:', mobo_linac.__version__); assert mobo_linac.__version__ == '1.0.0'"

      - name: Smoke test — CLI help
        run: |
          python -m mobo_linac.cli --help

      - name: Verify documentation and configuration sync
        run: |
          python scripts/verify_docs_sync.py

      - name: Run unit test suite (without ASTRA binary requirement)
        run: |
          pytest -v -m "not integration" --tb=short
